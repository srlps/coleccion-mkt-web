<!DOCTYPE html>
<html>

<head>
  <title>Colección MKT web</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" href="favicon.ico">

  <!-- bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- blk design system react theme CSS -->
  <link rel="stylesheet" href="css/blk-design-system-react.min.css">

  <!-- custom CSS -->
  <link rel="stylesheet" href="css/mkt.css">

  <!-- fontawesome -->
  <script src="https://kit.fontawesome.com/710ee664bc.js" crossorigin="anonymous"></script>

  <!-- jQuery library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <!-- Popper JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>

  <!-- bootstrap JavaScript -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <!-- sheetrock (google spreadsheet as database) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-sheetrock/1.1.4/dist/sheetrock.min.js"></script>

  <!-- lazysizes (img cache and lazy loading) -->
  <script src="js/lazysizes.min.js"></script>
</head>

<body>

  <div class="row mt-5" id="spinner-row">
    <div class="col text-center">
      <i class="fas fa-spinner fa-5x fa-spin"></i>
    </div>
  </div>

  <div class="modal mkt-menu-modal-fade" id="menuModal" tabindex="-1" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-sm position-fixed" style="display:contents;">
      <div class="modal-content">
        <div class="modal-body bg-primary p-1">
          <div class="list-group border-0">
            <div class="dropdown-divider"></div>
            <div class="list-group-item bg-primary border-0 p-0">
              <div class="d-flex w-100 justify-content-start align-items-center">
                <img class="mkt-user-profile-picture img-fluid rounded-lg w-25 p-2" style="height:min-content;">
                <div class="text-center pl-2 w-75">
                  <h5 class="mkt-user-display-name font-weight-bold mb-1"></h5>
                  <button type="button" class="mkt-logout-button btn btn-sm btn-outline-primary">Salir</button>
                </div>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <a class="mkt-menu-item list-group-item list-group-item-action list-group-item-primary px-3 active disabled"
              aria-current="true" tabindex="-1" aria-disabled="true" href="#collection">Colección</a>
            <a class="list-group-item list-group-item-action list-group-item-primary px-3 disabled" tabindex="-1"
              aria-disabled="true" href="#ranking">Ranking</a>
            <a class="list-group-item list-group-item-action list-group-item-primary px-3 disabled" tabindex="-1"
              aria-disabled="true" href="#circuits">Circuitos</a>
            <a class="list-group-item list-group-item-action list-group-item-primary px-3 disabled" tabindex="-1"
              aria-disabled="true" href="#calculator">Calculadora de puntos</a>
            <a class="list-group-item list-group-item-action list-group-item-primary px-3 disabled" tabindex="-1"
              aria-disabled="true" href="#stats">Estadísticas</a>
            <div class="dropdown-divider"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex d-md-none row justify-content-start align-items-center sticky-top bg-primary mt-0 mx-0"
    id="menu-div-sm" style="display:none !important;">
    <div class="col-2 px-0 text-center">
      <button type="button" class="btn btn-sm btn-primary" data-toggle="modal" data-target="#menuModal">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <div class="col-8 px-0 text-center">
      <h4 class="font-weight-bold mb-0">Colección MKT Web</h4>
    </div>
  </div>

  <div class="row justify-content-center mt-0 mx-0" id="main-div" style="display:none;">
    <div class="d-none d-md-block col-md-2 bg-primary px-0">
      <div class="list-group border-0 position-sticky" style="top:0;overflow-y:auto;height:100vh;">
        <div class="list-group-item bg-primary border-0 px-2 pb-2 text-center">
          <h4 class="font-weight-bold mb-0">Colección MKT Web</h4>
        </div>
        <div class="dropdown-divider"></div>
        <div class="list-group-item bg-primary border-0 px-2 px-lg-3 py-2">
          <div class="d-flex w-100 justify-content-start align-items-center">
            <img class="mkt-user-profile-picture img-fluid rounded-lg w-25" style="height:min-content;">
            <div class="text-center pl-2 w-75">
              <h5 class="mkt-user-display-name font-weight-bold mb-1"></h5>
              <button type="button" class="mkt-logout-button btn btn-sm btn-outline-primary">Salir</button>
            </div>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <a class="mkt-menu-item list-group-item list-group-item-action list-group-item-primary px-3 active disabled"
          aria-current="true" tabindex="-1" aria-disabled="true" href="#collection">Colección</a>
        <a class="list-group-item list-group-item-action list-group-item-primary px-3 disabled" tabindex="-1"
          aria-disabled="true" href="#ranking">Ranking</a>
        <a class="list-group-item list-group-item-action list-group-item-primary px-3 disabled" tabindex="-1"
          aria-disabled="true" href="#circuits">Circuitos</a>
        <a class="list-group-item list-group-item-action list-group-item-primary px-3 disabled" tabindex="-1"
          aria-disabled="true" href="#calculator">Calculadora de puntos</a>
        <a class="list-group-item list-group-item-action list-group-item-primary px-3 disabled" tabindex="-1"
          aria-disabled="true" href="#stats">Estadísticas</a>
        <div class="dropdown-divider"></div>
      </div>
    </div>

    <div class="col-auto col-md-10 px-0" id="content-container"></div>
  </div>

  <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-app.js"></script>

  <!-- If you enabled Analytics in your project, add the Firebase SDK for Analytics -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-analytics.js"></script>

  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-firestore.js"></script>

  <!-- app logic -->
  <script src="js/main.js"></script>
</body>

</html>

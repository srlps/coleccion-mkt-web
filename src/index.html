<!DOCTYPE html>
<html>

<head>
  <title>Colección MKT web</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" href="favicon.ico">

  <!-- bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- blk design system react theme CSS -->
  <link rel="stylesheet" href="css/blk-design-system-react.min.css">

  <!-- fontawesome -->
  <script src="https://kit.fontawesome.com/710ee664bc.js" crossorigin="anonymous"></script>

  <!-- jQuery library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <!-- Popper JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>

  <!-- bootstrap JavaScript -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>

<body>

  <div class="jumbotron mx-4 mx-md-5 mt-4">
    <div class="row">
      <div class="col text-center">
        <h1 class="display-3 text-dark">Inicia sesión para acceder</h1>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <button type="button" class="btn btn-block btn-secondary" id="google_login_button" disabled>
          <i class="fab fa-google"></i> Iniciar sesión con Google
        </button>
      </div>
    </div>

    <div class="row mt-3" id="spinner-row">
      <div class="col text-center">
        <i class="fas fa-spinner fa-5x fa-spin"></i>
      </div>
    </div>
  </div>

  <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-app.js"></script>

  <!-- If you enabled Analytics in your project, add the Firebase SDK for Analytics -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-analytics.js"></script>

  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-auth.js"></script>

  <!-- app logic -->
  <script src="js/login.js"></script>
</body>

</html>

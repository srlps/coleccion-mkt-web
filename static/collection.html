<!DOCTYPE html>
<html>

<head>
  <title>Colección MKT web</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" href="favicon.ico">

  <!-- bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- blk design system react theme CSS -->
  <link rel="stylesheet" href="css/blk-design-system-react.min.css">

  <!-- fontawesome -->
  <script src="https://kit.fontawesome.com/710ee664bc.js" crossorigin="anonymous"></script>

  <!-- jQuery library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <!-- Popper JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>

  <!-- bootstrap JavaScript -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <!-- sheetrock (google spreadsheet as database) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-sheetrock/1.1.4/dist/sheetrock.min.js"></script>
</head>

<body>

  <div class="container mx-4 mx-md-5 mt-4" id="loader-container">
    <p>Cargando ...</p>
  </div>

  <div class="container mx-4 mx-md-5 mt-4" id="main-container">
    <div class="row mb-4">
      <div class="col text-center">
        <div class="btn-group btn-group-toggle" data-toggle="buttons">
          <label class="mkt-radio btn btn-primary active">
            <input type="radio" name="element-type" value="drivers" checked> Pilotos
          </label>
          <label class="mkt-radio btn btn-secondary">
            <input type="radio" name="element-type" value="karts"> Vehículos
          </label>
          <label class="mkt-radio btn btn-secondary">
            <input type="radio" name="element-type" value="gliders"> Alas
          </label>
        </div>
      </div>
    </div>
    <div class="row row-cols-4" id="card-grid">
    </div>
  </div>

  <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-app.js"></script>

  <!-- If you enabled Analytics in your project, add the Firebase SDK for Analytics -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-analytics.js"></script>

  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.4.2/firebase-storage.js"></script>

  <!-- app logic -->
  <script src="js/collection.js"></script>
</body>

</html>
